<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
<title id="title">Tool로 필요한 정보를 실제로 조회하는 과정</title>
<desc id="desc">에이전트가 필요한 정보를 정리하고 도구를 호출하면, 도구가 검색이나 조회를 수행해 내용과 출처를 반환합니다. 에이전트는 반환 결과를 확인해 답변에 활용합니다. Microsoft 기술의 지원 조건을 Learn 도구로 조회하는 경우를 예로 듭니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9ca3af" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1078" height="408" rx="24" fill="white" stroke="#e7e7e7"/>
<g font-family="Malgun Gothic, sans-serif">

<rect x="20" y="20" width="1040" height="79" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#292929">Tool — 필요한 정보를 실제로 찾는 기능</text>
<text x="540" y="82" text-anchor="middle" font-size="17" font-weight="400" fill="#707070">에이전트가 요청하고, 도구가 실행한 결과를 돌려줍니다.</text>
<rect x="28" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="168" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">에이전트</text>
<text x="168" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">필요한 정보와 요청 정리</text>
<text x="168" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">예: Microsoft 기술의 지원 조건</text>
<rect x="400" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="540" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">Tool</text>
<text x="540" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">실제 검색·조회 수행</text>
<text x="540" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">예: Learn 공식 문서 검색</text>
<rect x="772" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="912" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">도구 실행 결과</text>
<text x="912" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">찾은 내용과 출처 전달</text>
<text x="912" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">예: 문서 내용·URL</text>
<path d="M323 209 H384" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<path d="M695 209 H756" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<rect x="28" y="310" width="1024" height="68" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#292929">에이전트는 도구의 실행 결과를 확인해 답변에 활용합니다.</text>
<text x="540" y="364" text-anchor="middle" font-size="16" font-weight="400" fill="#707070">연결만 했는지가 아니라, 실제로 조회한 내용과 출처가 있는지 확인합니다.</text>
</g></svg>