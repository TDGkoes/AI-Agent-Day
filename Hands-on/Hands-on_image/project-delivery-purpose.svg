<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">프로젝트 산출물 작성 에이전트의 목적과 개선 효과</title>
<desc id="desc">사람이 자료를 확인하며 문서별로 작성하던 제안서와 WBS를 에이전트가 자료와 근거를 연결해 초안으로 작성합니다. 수작업 초안 작성 시간은 약 3일로 추산한 값이고, 에이전트의 약 1시간은 실제 구축 경험을 기준으로 하며, 담당자가 내용과 근거를 검토하고 수정·보완한 뒤 고객에게 전달합니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9ca3af" stroke-width="1.5"/></marker>
<g id="doc" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 1 H16 L22 7 V28 H2 Z M16 1 V7 H22 M7 13 H17 M7 18 H17 M7 23 H14"/></g></defs>
<rect x="1" y="1" width="1078" height="618" rx="24" fill="white" stroke="#e7e7e7"/>
<g font-family="Malgun Gothic, sans-serif">
<rect x="20" y="20" width="1040" height="106" rx="16" fill="#f6f6f6"/><text x="48" y="65" font-size="29" fill="#292929" font-weight="700" text-anchor="start">프로젝트 산출물 작성, 더 쉽고 빠르게</text><text x="48" y="99" font-size="18" fill="#707070" font-weight="400" text-anchor="start">자료와 근거를 연결해 초안을 만들고, 검토한 내용으로 고객 전달을 지원합니다.</text><rect x="28" y="150" width="302" height="260" rx="16" fill="white" stroke="#e3e5e7"/><text x="48" y="181" font-size="14" fill="#858585" font-weight="700" text-anchor="start">기존 수작업</text><text x="48" y="219" font-size="23" fill="#292929" font-weight="700" text-anchor="start">사람이 문서별로 작성</text><circle cx="53" cy="252" r="3" fill="#a3a3a3"/><text x="68" y="258" font-size="17" fill="#606060" font-weight="400" text-anchor="start">자료 확인·내용 정리</text><circle cx="53" cy="285" r="3" fill="#a3a3a3"/><text x="68" y="291" font-size="17" fill="#606060" font-weight="400" text-anchor="start">제안서·WBS 직접 작성</text><circle cx="53" cy="318" r="3" fill="#a3a3a3"/><text x="68" y="324" font-size="17" fill="#606060" font-weight="400" text-anchor="start">문서 간 정보 대조·수정</text><path d="M48 348 H310" stroke="#eeeeee"/><text x="48" y="382" font-size="15" fill="#858585" font-weight="400" text-anchor="start">자료 확인과 반복 작성에 시간 투입</text><path d="M341 280 H373" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/><rect x="386" y="150" width="666" height="260" rx="16" fill="white" stroke="#e3e5e7"/><text x="410" y="181" font-size="14" fill="#00a63a" font-weight="700" text-anchor="start">에이전트 활용</text><text x="410" y="219" font-size="23" fill="#292929" font-weight="700" text-anchor="start">분석 결과와 근거를 이어 초안 작성</text><text x="410" y="254" font-size="17" fill="#606060" font-weight="400" text-anchor="start">RFP·업무 자료 확인</text><text x="410" y="282" font-size="17" fill="#606060" font-weight="400" text-anchor="start">청사진·인력·일정 연결</text><text x="410" y="310" font-size="17" fill="#606060" font-weight="400" text-anchor="start">선행 결과 재사용</text><path d="M670 274 H700" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="716" y="239" width="310" height="62" rx="10" fill="#f8f9fa"/><use href="#doc" x="732" y="255" color="#00b83f"/><text x="770" y="266" font-size="19" fill="#292929" font-weight="700" text-anchor="start">제안서</text><text x="770" y="288" font-size="14" fill="#858585" font-weight="400" text-anchor="start">PowerPoint · PPTX</text><rect x="716" y="315" width="310" height="62" rx="10" fill="#f8f9fa"/><use href="#doc" x="732" y="331" color="#00b83f"/><text x="770" y="342" font-size="19" fill="#292929" font-weight="700" text-anchor="start">WBS</text><text x="770" y="364" font-size="14" fill="#858585" font-weight="400" text-anchor="start">Excel · XLSX</text><path d="M410 348 H690" stroke="#eeeeee"/><text x="410" y="382" font-size="15" fill="#00a63a" font-weight="400" text-anchor="start">문서 작성 자동화 · 자료 기반 내용 구성</text><rect x="28" y="434" width="1024" height="130" rx="16" fill="#f6f6f6"/><text x="52" y="468" font-size="15" fill="#707070" font-weight="700" text-anchor="start">초안 작성 시간 개선</text><text x="52" y="513" font-size="27" fill="#00a63a" font-weight="700" text-anchor="start">약 3일 → 약 1시간</text><text x="52" y="542" font-size="17" fill="#606060" font-weight="400" text-anchor="start">수작업 추정 → 에이전트 활용</text><path d="M364 456 V542" stroke="#e0e0e0"/><text x="472" y="491" text-anchor="middle" font-size="19" fill="#292929" font-weight="700">근거·내용 검토</text><text x="472" y="521" text-anchor="middle" font-size="14" fill="#707070">사실·일관성·양식 확인</text><path d="M572 500 H596" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><text x="696" y="491" text-anchor="middle" font-size="19" fill="#292929" font-weight="700">수정·보완</text><text x="696" y="521" text-anchor="middle" font-size="14" fill="#707070">검토 사항 반영·재확인</text><path d="M796 500 H820" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><text x="920" y="491" text-anchor="middle" font-size="19" fill="#292929" font-weight="700">고객 전달</text><text x="920" y="521" text-anchor="middle" font-size="14" fill="#707070">최종 산출물 딜리버리</text><text x="540" y="595" font-size="14" fill="#858585" font-weight="400" text-anchor="middle">수작업은 추정치, 에이전트는 구축 경험 기준입니다. 고객 전달 전 검토·수정·보완이 필요합니다.</text></g></svg>