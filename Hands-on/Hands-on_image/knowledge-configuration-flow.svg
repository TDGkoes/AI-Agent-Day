<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">업무 질문에서 검색 검증까지의 지식 구성 순서</title><desc id="desc">예상 질문을 정하고 필요한 정보와 원본 자료를 확인한 뒤, 사용 목적과 연결 범위를 지정하고 실제 검색 결과를 검증합니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#999" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="998" height="298" rx="20" fill="white" stroke="#e7e7e7"/><g font-family="Malgun Gothic, sans-serif" text-anchor="middle"><rect x="18" y="16" width="964" height="76" rx="14" fill="#f6f6f6"/><text x="500" y="47" font-size="20" font-weight="700" fill="#292929">업무에 필요한 지식을 구성하는 순서</text><text x="500" y="73" font-size="15" fill="#858585">인력 추천을 예로, 질문에 필요한 근거가 실제로 조회되는지 확인</text><rect x="18" y="120" width="180" height="112" rx="12" fill="white" stroke="#e6e6e6"/><text x="108" y="149" font-size="17" font-weight="700" fill="#292929">1. 예상 질문</text><text x="108" y="178" font-size="15" fill="#00b83f">누가 적합한가?</text><text x="108" y="207" font-size="14" fill="#777">업무 목적 정하기</text><path d="M200 176 H210" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#a)"/><rect x="214" y="120" width="180" height="112" rx="12" fill="white" stroke="#e6e6e6"/><text x="304" y="149" font-size="17" font-weight="700" fill="#292929">2. 필요 정보</text><text x="304" y="178" font-size="15" fill="#00b83f">기술 · Level · 경험</text><text x="304" y="207" font-size="14" fill="#777">판단할 정보 정하기</text><path d="M396 176 H406" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#a)"/><rect x="410" y="120" width="180" height="112" rx="12" fill="white" stroke="#e6e6e6"/><text x="500" y="149" font-size="17" font-weight="700" fill="#292929">3. 원본 자료</text><text x="500" y="178" font-size="15" fill="#00b83f">인력관리표</text><text x="500" y="207" font-size="14" fill="#777">정보·기준일 확인</text><path d="M592 176 H602" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#a)"/><rect x="606" y="120" width="180" height="112" rx="12" fill="white" stroke="#e6e6e6"/><text x="696" y="149" font-size="17" font-weight="700" fill="#292929">4. 용도·범위 지정</text><text x="696" y="178" font-size="15" fill="#00b83f">추천 근거로 활용</text><text x="696" y="207" font-size="14" fill="#777">설명·접근 범위 설정</text><path d="M788 176 H798" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#a)"/><rect x="802" y="120" width="180" height="112" rx="12" fill="white" stroke="#e6e6e6"/><text x="892" y="149" font-size="17" font-weight="700" fill="#292929">5. 검색 검증</text><text x="892" y="178" font-size="15" fill="#00b83f">이름 · 근거 · 출처</text><text x="892" y="207" font-size="14" fill="#777">실제 조회 결과 확인</text><text x="500" y="273" font-size="15" fill="#777">필요한 정보가 없으면 원본 자료를, 조회되지 않으면 연결·검색 범위를 다시 확인</text></g></svg>