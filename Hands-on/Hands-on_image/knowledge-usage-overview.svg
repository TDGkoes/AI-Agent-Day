<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
<title id="title">Knowledge는 답변의 근거가 되는 업무 자료</title>
<desc id="desc">인력 추천의 예로, 질문에 필요한 기술과 경험을 연결된 인력 자료에서 확인하고 후보와 추천 이유, 출처를 답변합니다. 자료에 없는 내용은 추측하지 않고 확인이 필요하다고 표시합니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9ca3af" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1078" height="408" rx="24" fill="white" stroke="#e7e7e7"/>
<g font-family="Malgun Gothic, sans-serif">

<rect x="20" y="20" width="1040" height="79" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#292929">Knowledge — 답변의 근거가 되는 업무 자료</text>
<text x="540" y="82" text-anchor="middle" font-size="17" font-weight="400" fill="#707070">인력 추천 예시: 질문에 필요한 정보를 자료에서 확인합니다.</text>
<rect x="28" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="168" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">사용자 질문</text>
<text x="168" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">이 역할에 누가 적합할까?</text>
<text x="168" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">필요한 기술·경험 확인</text>
<rect x="400" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="540" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">Knowledge</text>
<text x="540" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">연결된 인력 자료 참고</text>
<text x="540" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">이름·기술·경험·Level</text>
<rect x="772" y="136" width="280" height="147" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="912" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#00a63a">자료에 근거한 답변</text>
<text x="912" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">후보와 추천 이유 제시</text>
<text x="912" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">근거를 확인할 출처 포함</text>
<path d="M323 209 H384" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<path d="M695 209 H756" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<rect x="28" y="310" width="1024" height="68" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="338" text-anchor="middle" font-size="19" font-weight="700" fill="#292929">자료에 있는 정보로 판단하고, 없는 정보는 확인이 필요하다고 표시합니다.</text>
<text x="540" y="364" text-anchor="middle" font-size="16" font-weight="400" fill="#707070">예: 기술과 경험으로 후보를 추천하되, 가용성 정보가 없으면 “확인 중”으로 남깁니다.</text>
</g></svg>