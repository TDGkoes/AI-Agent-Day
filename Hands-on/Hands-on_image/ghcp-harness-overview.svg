<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">GHCP Harness가 목표를 실제 업무로 연결하는 구성</title>
<desc id="desc">사용자 목표에 맞춰 지침, Skill, Tool, Knowledge를 연결합니다. 하네스는 모델의 판단과 필요한 기능의 실행을 조정하고, 여러 작업 수행과 파일 작성을 지원해 분석 결과와 PowerPoint, Excel 파일을 제공합니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9ca3af" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1078" height="648" rx="24" fill="white" stroke="#e7e7e7"/>
<g font-family="Malgun Gothic, sans-serif">

<rect x="20" y="20" width="1040" height="80" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="54" text-anchor="middle" font-size="27" font-weight="700" fill="#292929">GHCP Harness — 목표를 실제 업무로 연결</text>
<text x="540" y="82" text-anchor="middle" font-size="17" font-weight="400" fill="#707070">AI 모델의 이해·판단을 필요한 기능의 실행으로 이어 줍니다.</text>
<rect x="28" y="120" width="1024" height="68" rx="14" fill="white" stroke="#e3e5e7"/>
<text x="52" y="146" text-anchor="start" font-size="14" font-weight="700" fill="#00a63a">사용자 목표</text>
<text x="52" y="174" text-anchor="start" font-size="21" font-weight="400" fill="#292929">“RFP를 읽고 제안서와 WBS를 작성해줘.”</text>
<path d="M540 199 V218" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<rect x="28" y="230" width="1024" height="244" rx="14" fill="#f8f9fa" stroke="#e3e5e7"/>
<text x="52" y="264" text-anchor="start" font-size="21" font-weight="700" fill="#292929">GHCP Harness 안에서 필요한 구성 요소를 활용</text>
<rect x="44" y="284" width="236" height="105" rx="12" fill="white" stroke="#e3e5e7"/>
<text x="162" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#00a63a">Instructions</text>
<text x="162" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#292929">전체 목표·규칙</text>
<text x="162" y="373" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">어디까지, 무엇을 지킬지</text>
<rect x="296" y="284" width="236" height="105" rx="12" fill="white" stroke="#e3e5e7"/>
<text x="414" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#00a63a">Skill</text>
<text x="414" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#292929">업무별 작업 방법</text>
<text x="414" y="373" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">분석·제안서·WBS 작성법</text>
<rect x="548" y="284" width="236" height="105" rx="12" fill="white" stroke="#e3e5e7"/>
<text x="666" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#00a63a">Tool</text>
<text x="666" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#292929">실행할 기능</text>
<text x="666" y="373" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">공식 문서 조회 등</text>
<rect x="800" y="284" width="236" height="105" rx="12" fill="white" stroke="#e3e5e7"/>
<text x="918" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#00a63a">Knowledge</text>
<text x="918" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#292929">참고할 자료</text>
<text x="918" y="373" text-anchor="middle" font-size="15" font-weight="400" fill="#707070">인력표·기존 업무 사례</text>
<path d="M52 408 H1028" stroke="#e3e5e7"/>
<text x="209" y="445" text-anchor="middle" font-size="18" font-weight="400" fill="#606060">여러 작업을 이어 수행</text>
<text x="540" y="445" text-anchor="middle" font-size="18" font-weight="400" fill="#606060">코드 실행으로 파일 작성</text>
<text x="871" y="445" text-anchor="middle" font-size="18" font-weight="400" fill="#606060">격리된 환경에서 작업</text>
<path d="M540 485 V504" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
<rect x="28" y="516" width="1024" height="88" rx="14" fill="#f6f6f6" stroke="none"/>
<text x="540" y="547" text-anchor="middle" font-size="23" font-weight="700" fill="#292929">분석 결과 · PowerPoint 제안서 · Excel WBS</text>
<text x="540" y="579" text-anchor="middle" font-size="17" font-weight="400" fill="#707070">Project Delivery 에이전트의 결과는 검토·수정 후 고객에게 전달합니다.</text>
<text x="540" y="630" text-anchor="middle" font-size="15" font-weight="400" fill="#858585">필요한 작업과 도구를 선택하고, 중간 결과를 다음 작업에 활용합니다.</text>
</g></svg>